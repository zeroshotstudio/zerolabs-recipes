name: Recipes CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan Repository for Leaked Secrets & Sensitive Data
        run: |
          python3 scripts/scan_secrets.py .

      - name: Lint and Validate Python Syntax
        run: |
          python -m pip install --upgrade pip flake8
          # Check for Python syntax errors or undefined names
          flake8 recipes --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Docker Compose Configurations
        run: |
          find recipes -name "docker-compose.yml" | while read -r f; do
            echo "Validating $f..."
            docker compose -f "$f" config > /dev/null
          done
