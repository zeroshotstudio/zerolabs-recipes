# Rate limiting zone for SSE endpoint (prevents connection exhaustion)
limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=30r/s;

upstream mcp_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name mcp.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/mcp.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Maximum payload size for tool requests / resources
    client_max_body_size 16M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # MCP SSE Endpoint and Message Routing
    location / {
        limit_req zone=mcp_limit burst=50 nodelay;

        proxy_pass http://mcp_backend;
        proxy_http_version 1.1;

        # Mandatory SSE and Streaming Reverse Proxy Directives
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve Authorization and Custom MCP Headers
        proxy_pass_header Authorization;
        proxy_pass_header Mcp-Session-Id;

        # Extended Timeouts for Long-Lived Streaming Connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
