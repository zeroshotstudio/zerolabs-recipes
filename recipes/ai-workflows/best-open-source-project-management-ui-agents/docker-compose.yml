version: "3.8"

services:
  # Vikunja: Fast, lightweight open-source task management backend for agents
  vikunja-api:
    image: vikunja/api:latest
    container_name: zerolabs-pm-vikunja-api
    environment:
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /app/vikunja/files/vikunja.db
      VIKUNJA_SERVICE_JWTSECRET: "replace-with-a-random-secret-for-production"
      VIKUNJA_SERVICE_FRONTENDURL: "http://localhost:3456/"
    volumes:
      - vikunja-data:/app/vikunja/files
    ports:
      - "3456:3456"
    restart: unless-stopped

volumes:
  vikunja-data:
