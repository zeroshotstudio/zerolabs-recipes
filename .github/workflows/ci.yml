name: Recipes CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Repository for Leaked Secrets & Sensitive Data
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/scan_secrets.py .

      - name: Lint and Validate Python Syntax
        run: |
          python -m pip install --upgrade pip flake8
          # Check for Python syntax errors or undefined names
          flake8 recipes --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Docker Compose Configurations
        run: |
          find recipes -name "docker-compose.yml" | while read -r f; do
            echo "Validating $f..."
            docker compose -f "$f" config > /dev/null
          done

  offline-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: |
          python -m pip install \
            -r recipes/01-claude-mcp-agent-starter/requirements.txt \
            -r recipes/claude/19-integrate-sandbox-bash-tool/python/requirements.txt \
            -r recipes/claude/20-deterministic-file-edits-text-editor/python/requirements.txt \
            -r recipes/claude/21-provision-sandbox-computer-use/python/requirements.txt \
            -r recipes/claude/22-build-mcp-server-python-sdk/python/requirements.txt \
            -r recipes/claude/29-streaming-refusal-guardrails/python/requirements.txt \
            -r recipes/claude/30-track-usage-costs-admin-api/python/requirements.txt
      - name: Prepare actual sandbox test image
        run: docker build --tag zerolabs-bash-sandbox:1.0.0 recipes/claude/19-integrate-sandbox-bash-tool
      - name: Run offline recipe tests
        env:
          RUN_SANDBOX_DOCKER_TESTS: '1'
        run: |
          python -m unittest discover -s recipes/01-claude-mcp-agent-starter -p 'test_*.py' -v
          python -m unittest discover -s recipes/ai-workflows/setting-up-ai-coding-agents-claude-code-codex-and-gemini-cli -p 'test_*.py' -v
          python -m unittest discover -s recipes/ai-workflows/best-open-source-project-management-ui-agents -p 'test_*.py' -v
          python recipes/ai-workflows/learn-german-passively-ai-coding-assistant/test_zerodeutsch.py
          python -m unittest discover -s recipes/claude/19-integrate-sandbox-bash-tool/python -p 'test_*.py' -v
          python -m unittest discover -s recipes/claude/20-deterministic-file-edits-text-editor/python -p 'test_*.py' -v
          python -m unittest discover -s recipes/claude/21-provision-sandbox-computer-use/python -p 'test_*.py' -v
          python recipes/claude/22-build-mcp-server-python-sdk/python/client_test.py
          python -m unittest discover -s recipes/claude/29-streaming-refusal-guardrails/python -p 'test_*.py' -v
          python -m unittest discover -s recipes/claude/30-track-usage-costs-admin-api/python -p 'test_*.py' -v

  discover-typescript:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: packages
        name: Discover recipe packages
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', 'recipes'], text=True).splitlines()
          packages = sorted(str(Path(path).parent) for path in tracked if Path(path).name == 'package.json')
          if not packages:
              raise SystemExit('No recipe TypeScript packages discovered')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('packages=' + json.dumps(packages) + '\n')
          PY

  python-dependency-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency auditor
        run: python -m pip install pip-audit
      - name: Audit each declared recipe dependency set
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', 'recipes'], text=True).splitlines()
          requirements = sorted(path for path in tracked if Path(path).name == 'requirements.txt')
          if not requirements:
              raise SystemExit('No recipe requirements discovered')
          failed = False
          for path in requirements:
              print('Auditing ' + path, flush=True)
              result = subprocess.run([sys.executable, '-m', 'pip_audit', '-r', path, '--progress-spinner', 'off'])
              failed = failed or result.returncode != 0
          raise SystemExit(1 if failed else 0)
          PY

  typescript-recipes:
    needs: discover-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-typescript.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Compile TypeScript
        run: node "$GITHUB_WORKSPACE/scripts/check_recipe_typescript.mjs"
      - name: Prepare actual sandbox test image
        if: contains(matrix.package, '19-integrate-sandbox-bash-tool')
        run: docker build --tag zerolabs-bash-sandbox:1.0.0 "$GITHUB_WORKSPACE/recipes/claude/19-integrate-sandbox-bash-tool"
      - name: Run offline TypeScript tests
        env:
          RUN_SANDBOX_DOCKER_TESTS: '1'
        run: npm test --if-present
